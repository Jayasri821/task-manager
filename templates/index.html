<!DOCTYPE html>
<html>

<head>

<title>Task Manager</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<div class="top-bar">

<h1>Task Manager</h1>

<a href="/logout"
class="logout-btn">
Logout
</a>

</div>

<form action="/add"
method="POST"
class="task-form">

<input type="text"
name="task"
placeholder="Enter Task"
required>

<select name="priority">

<option>High</option>
<option>Medium</option>
<option>Low</option>

</select>

<input type="date"
name="due_date"
required>

<button type="submit">
Add Task
</button>

</form>

<div class="tasks">

{% for task in tasks %}

<div class="task-card">

<h2>{{ task[2] }}</h2>

<p>
Priority:
<span class="priority">
{{ task[3] }}
</span>
</p>

<p>
Due Date:
{{ task[4] }}
</p>

<p>
Status:
<span class="status">
{{ task[5] }}
</span>
</p>

<div class="buttons">

<a href="/complete/{{ task[0] }}"
class="complete-btn">
Complete
</a>

<a href="/delete/{{ task[0] }}"
class="delete-btn">
Delete
</a>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
